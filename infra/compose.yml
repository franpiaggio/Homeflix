name: homeflix
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - ${CONFIG_ROOT:-/srv/homeflix/config}/jellyfin:/config
      - ${DATA_ROOT:-/srv/homeflix/data}/library:/media:ro
    networks: [media]
    mem_limit: 1g
    cpus: '1.5'
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment: {PUID: '${PUID}', PGID: '${PGID}', TZ: '${TZ}'}
    volumes:
      - ${CONFIG_ROOT:-/srv/homeflix/config}/radarr:/config
      - ${DATA_ROOT:-/srv/homeflix/data}:/data
    networks: [media]
    mem_limit: 512m
    cpus: '0.75'
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment: {PUID: '${PUID}', PGID: '${PGID}', TZ: '${TZ}'}
    volumes:
      - ${CONFIG_ROOT:-/srv/homeflix/config}/prowlarr:/config
    networks: [media]
    mem_limit: 512m
    cpus: '0.75'
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment: {PUID: '${PUID}', PGID: '${PGID}', TZ: '${TZ}', WEBUI_PORT: '8080'}
    volumes:
      - ${CONFIG_ROOT:-/srv/homeflix/config}/qbittorrent:/config
      - ${DATA_ROOT:-/srv/homeflix/data}:/data
    networks: [media]
    mem_limit: 1g
    cpus: '1.0'
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment: {PUID: '${PUID}', PGID: '${PGID}', TZ: '${TZ}'}
    volumes:
      - ${CONFIG_ROOT:-/srv/homeflix/config}/bazarr:/config
      - ${DATA_ROOT:-/srv/homeflix/data}/library:/data/library
    networks: [media]
    mem_limit: 512m
    cpus: '0.75'
  bot:
    image: node:22-alpine
    profiles: [bot]
    restart: unless-stopped
    user: '${PUID}:${PGID}'
    working_dir: /app
    command: ['node', 'src/index.mjs']
    environment:
      TELEGRAM_BOT_TOKEN: '${TELEGRAM_BOT_TOKEN:-}'
      ALLOWED_TELEGRAM_IDS: '${ALLOWED_TELEGRAM_IDS:-}'
      TMDB_API_KEY: '${TMDB_API_KEY:-}'
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: '${RADARR_API_KEY:-}'
      RADARR_ROOT_FOLDER: /data/library/movies
      STATE_FILE: /state/state.json
    volumes:
      - ../apps/bot:/app:ro
      - ${CONFIG_ROOT:-/srv/homeflix/config}/bot:/state
    networks: [media]
    mem_limit: 256m
    cpus: '0.5'
networks:
  media:
    driver: bridge
